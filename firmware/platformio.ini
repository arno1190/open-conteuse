[platformio]
default_envs = mini, explore

[env]
platform = espressif32@6.9.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@1.40501.0
board = conteuse_s3_n16r8
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
build_src_filter = +<compact_bringup.cpp>
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit ILI9341@1.6.1
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2

[env:mini]
build_flags = ${env.build_flags} -DCONTEUSE_MINI=1

[env:explore]
build_flags = ${env.build_flags} -DCONTEUSE_EXPLORE=1
