name: Showcase and Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/starter/**'
      - 'rfq/**'
      - 'docs/design/**'
      - 'scripts/build_site.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/site-playback.cjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'content/starter/**'
      - 'rfq/**'
      - 'docs/design/**'
      - 'scripts/build_site.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/site-playback.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run test:site
      - run: node --check site/strings.js
      - run: node --check site/app.js
      - run: python3 site/check.py
      - run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: work/site-public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: showcase
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public showcase
        id: deployment
        uses: actions/deploy-pages@v4
